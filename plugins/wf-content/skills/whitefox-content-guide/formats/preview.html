<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft: WhiteFox</title>
<!-- The step also sets this <title> to "Draft: <DATA.title>" so the artifact card says what it is for. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Draft preview for WhiteFox writing steps. A step copies this file unchanged except for the
  DATA block below, fills DATA with the draft it wants approved, and shows it as an artifact.
  The page shows the draft as it will read in its channel, with Copy buttons for the clean text.
  It saves nothing: approval and changes still happen in the chat.

  DATA shape:
  {
    "stage": "Stage 3 of 3, Write: step 2 of 2, draft 1 of 3, LinkedIn post",  // optional
    "channel": "linkedin-post",              // linkedin-post | email | website-article
    "title": "LinkedIn post, ANGLE-03",      // article: the H1
    "persona": "Engineer voice",             // linkedin-post: who posts it
    "words": 180, "range": "110 to 180 words",
    "body": "the draft text, paragraphs separated by a blank line",
            // article: Markdown with ## and ### headings, - and 1. lists, **bold**
    "subjects": ["...", "..."], "previewText": "...",           // email only
    "seo": { "title": "...", "meta": "...", "slug": "..." }     // article only
  }
-->
<style>
:root {
  --blue: #005de5; --blue-dark: #0044a7; --navy: #152d51; --blue-soft: #f3faff; --blue-tint: #d7edff;
  --logo: #000000;
  --surface: #ffffff; --page: #f2f4f7; --fg: #152d51; --text: #1f2633; --muted: #7a828e;
  --line: #e2e6ef; --ok: #1f7a4d; --warn: #a15c00; --on-blue: #ffffff; --link: #1a0dab; --url: #1e6b3a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --blue: #1f6fff; --blue-dark: #9cc2ff; --navy: #ffffff; --blue-soft: #1d3a63; --blue-tint: #2c4a75;
    --logo: #ffffff;
    --surface: #1b3760; --page: #152d51; --fg: #ffffff; --text: #e4e8ef; --muted: #98a1ae;
    --line: #2c4a75; --ok: #6fd39f; --warn: #f0b45a; --on-blue: #ffffff; --link: #8ab4f8; --url: #81c995;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text);
  font: 15px/1.6 "Bai Jamjuree", system-ui, -apple-system, "Segoe UI", sans-serif; }
.bar { background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 820px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mark { display: flex; align-items: center; gap: 8px; color: var(--logo); }
.mark .logo { height: 24px; width: auto; display: block; }
.mark b { font-weight: 500; color: var(--muted); font-size: 14px; padding-left: 8px; border-left: 1px solid var(--line); }
.stage { margin-left: auto; font-size: 13px; color: var(--blue-dark); background: var(--blue-soft);
  border: 1px solid var(--blue-tint); border-radius: 999px; padding: 3px 12px; }
main { max-width: 820px; margin: 0 auto; padding: 20px 16px 48px; }
.meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; color: var(--muted); font-size: 14px; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
.who { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--blue); color: var(--on-blue);
  display: grid; place-items: center; font-weight: 600; }
.name { font-weight: 600; color: var(--fg); line-height: 1.2; }
.sub { font-size: 13px; color: var(--muted); }
.post p { margin: 0 0 12px; white-space: pre-wrap; }
.label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.subj { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.subj span { flex: 1; font-weight: 500; color: var(--fg); }
.preview-line { color: var(--muted); margin: 10px 0 0; }
.snippet .t { color: var(--link); font-size: 19px; line-height: 1.3; }
.snippet .u { color: var(--url); font-size: 13px; }
.snippet .d { color: var(--muted); font-size: 14px; }
.counts { font-size: 13px; color: var(--muted); margin-top: 8px; }
.article h1 { font-size: 28px; line-height: 1.25; color: var(--fg); margin: 0 0 16px; font-weight: 600; }
.article h2 { font-size: 21px; color: var(--fg); margin: 26px 0 8px; font-weight: 600; }
.article h3 { font-size: 17px; color: var(--fg); margin: 18px 0 6px; font-weight: 600; }
.article p { margin: 0 0 12px; }
.article ul, .article ol { margin: 0 0 12px; padding-left: 22px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px;
  padding: 7px 16px; cursor: pointer; font: inherit; font-weight: 500; font-size: 14px; }
.btn.primary { background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
#status { color: var(--muted); font-size: 14px; }
.foot { color: var(--muted); font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>

  <span class="stage" id="stage"></span>
</div></div>
<main>
  <div class="meta" id="meta"></div>
  <div id="view"></div>
  <div class="actions"><button class="btn primary" id="copy" type="button"></button><span id="status"></span></div>
  <p class="foot">This page only shows the draft. To save it or change it, reply in the chat.</p>
</main>
<script>
/* DATA: the step replaces this object with its own draft. */
const DATA = {
  "stage": "Stage 3 of 3, Write: step 2 of 2, draft 1 of 1, LinkedIn post",
  "channel": "linkedin-post",
  "title": "LinkedIn post, example",
  "persona": "Engineer voice",
  "words": 42, "range": "110 to 180 words",
  "body": "First paragraph of the example post.\n\nSecond paragraph, with a **bold** phrase.\n\nA question to the reader?"
};
/* end DATA */

const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const plain = s => String(s ?? "").replace(/\*\*(.+?)\*\*/g, "$1");

function markdown(md) {
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  let para = [];
  const flush = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  for (const raw of String(md ?? "").split(/\r?\n/)) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flush(); close(); continue; }
    if ((m = line.match(/^(#{2,3})\s+(.*)$/))) { flush(); close(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
    if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { flush(); if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flush(); if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    close(); para.push(line.trim());
  }
  flush(); close();
  return out.join("\n");
}

function el(tag, cls, html) { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; }

async function copyText(text) {
  const status = document.getElementById("status");
  try { await navigator.clipboard.writeText(text); status.textContent = "Copied."; }
  catch (e) {
    const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select();
    try { document.execCommand("copy"); status.textContent = "Copied."; } catch (e2) { status.textContent = "Copy blocked: select the text and copy it."; }
    t.remove();
  }
}

const view = document.getElementById("view");
const meta = document.getElementById("meta");
const copyBtn = document.getElementById("copy");
const ch = DATA.channel;
const chLabel = { "linkedin-post": "LinkedIn post", "email": "Email", "website-article": "Article" }[ch] || ch;
meta.append(el("span", "pill", esc(chLabel)));
if (DATA.words != null) meta.append(el("span", "pill", `${esc(DATA.words)} words${DATA.range ? ` (aim: ${esc(DATA.range)})` : ""}`));

if (ch === "linkedin-post") {
  const card = el("div", "card");
  card.append(el("div", "who", `<div class="avatar">wf</div><div><div class="name">WhiteFox</div><div class="sub">${esc(DATA.persona || "")}</div></div>`));
  const post = el("div", "post");
  String(DATA.body || "").split(/\n\s*\n/).forEach(p => post.append(el("p", null, inline(p))));
  card.append(post); view.append(card);
  copyBtn.textContent = "Copy post";
  copyBtn.onclick = () => copyText(plain(DATA.body).trim());
} else if (ch === "email") {
  const head = el("div", "card");
  head.append(el("div", "label", "Subject options"));
  (DATA.subjects || []).forEach((s, i) => {
    const row = el("div", "subj", `<span>${esc(s)}</span>`);
    const b = el("button", "btn", "Copy"); b.type = "button"; b.onclick = () => copyText(s);
    row.append(b); head.append(row);
  });
  if (DATA.previewText) head.append(el("p", "preview-line", `Preview: ${esc(DATA.previewText)}`));
  view.append(head);
  const body = el("div", "card post");
  String(DATA.body || "").split(/\n\s*\n/).forEach(p => body.append(el("p", null, inline(p))));
  view.append(body);
  copyBtn.textContent = "Copy email body";
  copyBtn.onclick = () => copyText(plain(DATA.body).trim());
} else {
  const seo = DATA.seo || {};
  const tl = (seo.title || "").length, ml = (seo.meta || "").length;
  const card = el("div", "card snippet");
  card.append(el("div", "label", "How it may look in search"));
  card.append(el("div", "u", `whitefox.cloud/.../${esc(seo.slug || "")}`));
  card.append(el("div", "t", esc(seo.title || "")));
  card.append(el("div", "d", esc(seo.meta || "")));
  const tOk = tl >= 40 && tl <= 65, mOk = ml >= 100 && ml <= 155;
  card.append(el("div", "counts", `SEO title ${tl} characters <span class="pill ${tOk ? "ok" : "warn"}">aim 50 to 60</span> &nbsp; Meta description ${ml} characters <span class="pill ${mOk ? "ok" : "warn"}">aim 120 to 155</span>`));
  view.append(card);
  const art = el("div", "card article");
  art.append(el("h1", null, inline(DATA.title)));
  art.insertAdjacentHTML("beforeend", markdown(DATA.body));
  view.append(art);
  copyBtn.textContent = "Copy article (Markdown)";
  copyBtn.onclick = () => copyText(`# ${DATA.title}\n\n${String(DATA.body || "").trim()}\n`);
}

const stageEl = document.getElementById("stage");
if (DATA.stage) stageEl.textContent = DATA.stage; else stageEl.style.display = "none";
document.title = `Draft: ${DATA.title}`;
</script>
</body>
