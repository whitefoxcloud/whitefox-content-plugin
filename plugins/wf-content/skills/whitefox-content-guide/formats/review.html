<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review: WhiteFox</title>
<!-- The step also sets this <title> to "Review: <DATA.title>" so the artifact card says what it is for. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Review page for WhiteFox content steps. A step copies this file unchanged except for the
  DATA block below, fills DATA with the result it wants approved, and shows it as an artifact.
  The user keeps, drops, edits and adds rows, then copies their choices back into the chat.

  DATA shape:
  {
    "stage": "Stage 2 of 3, Find topics: step 2 of 3, mint lanes",   // optional header line
    "title": "Lanes for fin-2026-10",          // heading
    "item": "lane",                            // what one row is, used for "Add a lane"
    "allowAdd": true,                          // show the Add button
    "fields": [                                // columns, in order
      { "key": "label", "label": "Label", "edit": true },
      { "key": "stance", "label": "Stance", "edit": true, "long": true },
      { "key": "quote", "label": "Quote", "edit": false }   // edit false = locked (verbatim text)
    ],
    "rows": [ { "id": "1", "label": "...", "pick": "keep" } ],  // pick: optional starting choice
    "choice": ["keep", "active", "drop"]       // optional: 2 or more choices per row (default keep / drop);
                                               // the first is the default, the last dims the row (drop, rejected)
  }
-->
<style>
:root {
  --blue: #005de5; --blue-dark: #0044a7; --navy: #003077; --blue-soft: #f3faff; --blue-tint: #d7edff;
  --bg: #ffffff; --surface: #ffffff; --page: #f2f4f7; --fg: #003077; --text: #1f2633; --muted: #7a828e;
  --line: #e2e6ef; --keep: #1f7a4d; --keep-bg: #e6f4ec; --drop: #a23b3b; --drop-bg: #f8e9e9;
  --on-blue: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --blue: #5a9bff; --blue-dark: #7bb0ff; --navy: #dfe9ff; --blue-soft: #14213a; --blue-tint: #1c2f52;
    --bg: #11151c; --surface: #171c25; --page: #0d1117; --fg: #dfe9ff; --text: #e4e8ef; --muted: #98a1ae;
    --line: #2a3140; --keep: #6fd39f; --keep-bg: #183327; --drop: #f08c8c; --drop-bg: #3a2222;
    --on-blue: #0d1117;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text);
  font: 15px/1.5 "Bai Jamjuree", system-ui, -apple-system, "Segoe UI", sans-serif; }
.bar { background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 920px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mark { font-weight: 600; font-size: 17px; color: var(--fg); letter-spacing: .2px; }
.mark i { font-style: normal; color: var(--blue); }
.mark b { font-weight: 500; color: var(--muted); margin-left: 6px; font-size: 14px; }
.stage { margin-left: auto; font-size: 13px; color: var(--blue-dark); background: var(--blue-soft);
  border: 1px solid var(--blue-tint); border-radius: 999px; padding: 3px 12px; }
main { max-width: 920px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 22px; font-weight: 600; color: var(--fg); margin: 0 0 4px; }
.hint { color: var(--muted); margin: 0 0 18px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; margin-bottom: 10px; }
.row.dropped { opacity: .5; }
.head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.num { font-weight: 600; color: var(--fg); min-width: 28px; }
.tag { font-size: 12px; color: var(--muted); }
.toggle { margin-left: auto; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.toggle button { border: 0; background: transparent; color: var(--text); padding: 5px 12px; cursor: pointer; font: inherit; font-size: 14px; }
.toggle button + button { border-left: 1px solid var(--line); }
.toggle button.on.a { background: var(--keep-bg); color: var(--keep); font-weight: 600; }
.toggle button.on.b { background: var(--drop-bg); color: var(--drop); font-weight: 600; }
.toggle button.on.c { background: var(--blue); color: var(--on-blue); font-weight: 600; }
.field { margin-top: 8px; }
.label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 2px; text-transform: uppercase; letter-spacing: .4px; }
.value { white-space: pre-wrap; word-break: break-word; }
textarea, input[type=text] { width: 100%; font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; resize: vertical; }
textarea:focus, input[type=text]:focus { outline: 2px solid var(--blue-tint); border-color: var(--blue); }
.edited { border-color: var(--blue); background: var(--blue-soft); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 10px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px;
  padding: 9px 18px; cursor: pointer; font: inherit; font-weight: 500; }
.btn.primary { background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
.btn.primary:hover { background: var(--blue-dark); }
#out { width: 100%; min-height: 120px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
#status { color: var(--muted); }
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <span class="mark">white<i>fox</i><b>Content</b></span>
  <span class="stage" id="stage"></span>
</div></div>
<main>
  <h1 id="title"></h1>
  <p class="hint">Keep or drop each row, edit the text where needed, then press <b>Copy my choices</b>
    and paste the result into the chat. Nothing is saved until you do.</p>
  <div id="rows"></div>
  <div class="actions">
    <button class="btn" id="add" type="button"></button>
    <button class="btn primary" id="copy" type="button">Copy my choices</button>
    <span id="status"></span>
  </div>
  <textarea id="out" readonly aria-label="Your choices"></textarea>
</main>
<script>
/* DATA: the step replaces this object with its own result. */
const DATA = {
  "stage": "Stage 1 of 3, Add a case study: step 3 of 3, derive pains",
  "title": "Example review",
  "item": "item",
  "allowAdd": true,
  "fields": [
    { "key": "text", "label": "Text", "edit": true, "long": true },
    { "key": "source", "label": "Source", "edit": false }
  ],
  "rows": [
    { "id": "1", "text": "First example row", "source": "example-P01" },
    { "id": "2", "text": "Second example row", "source": "example-P02" }
  ]
};
/* end DATA */

const choices = Array.isArray(DATA.choice) && DATA.choice.length >= 2 ? DATA.choice : ["keep", "drop"];
const last = choices[choices.length - 1];
const state = DATA.rows.map(r => ({ id: String(r.id), orig: r, vals: { ...r },
  pick: choices.includes(r.pick) ? r.pick : choices[0], isNew: false }));
let newCount = 0;

function el(tag, props = {}, kids = []) {
  const n = document.createElement(tag);
  Object.assign(n, props);
  kids.forEach(k => n.append(k));
  return n;
}

function render() {
  const box = document.getElementById("rows");
  box.replaceChildren();
  state.forEach(s => {
    const row = el("div", { className: "row" + (s.pick === last ? " dropped" : "") });
    const toggle = el("div", { className: "toggle" });
    choices.forEach((c, i) => {
      const b = el("button", { type: "button", textContent: c,
        className: (s.pick === c ? "on " : "") + (i === 0 ? "a" : i === choices.length - 1 ? "b" : "c") });
      b.onclick = () => { s.pick = c; render(); update(); };
      toggle.append(b);
    });
    row.append(el("div", { className: "head" }, [
      el("span", { className: "num", textContent: s.isNew ? "new" : s.id }),
      el("span", { className: "tag", textContent: s.isNew ? "added by you" : "" }),
      toggle,
    ]));
    DATA.fields.forEach(f => {
      const wrap = el("div", { className: "field" }, [el("span", { className: "label", textContent: f.label })]);
      const v = s.vals[f.key] == null ? "" : String(s.vals[f.key]);
      if (f.edit || s.isNew) {
        const input = f.long ? el("textarea", { rows: 2, value: v }) : el("input", { type: "text", value: v });
        const mark = () => input.classList.toggle("edited", !s.isNew && input.value !== String(s.orig[f.key] ?? ""));
        mark();
        input.oninput = () => { s.vals[f.key] = input.value; mark(); update(); };
        wrap.append(input);
      } else {
        wrap.append(el("div", { className: "value", textContent: v || "(none)" }));
      }
      row.append(wrap);
    });
    box.append(row);
  });
}

function update() {
  const lines = [`Decisions for ${DATA.title}:`];
  state.forEach(s => {
    if (s.isNew) {
      if (s.pick === last) return;
      const parts = DATA.fields.map(f => `${f.label} = ${(s.vals[f.key] || "").trim() || "(none)"}`);
      const tag = s.pick === choices[0] ? "" : ` (${s.pick})`;
      lines.push(`new ${DATA.item}${tag}: ${parts.join("; ")}`);
      return;
    }
    const edits = DATA.fields
      .filter(f => f.edit && String(s.vals[f.key] ?? "") !== String(s.orig[f.key] ?? ""))
      .map(f => `${f.label} = ${String(s.vals[f.key]).trim() || "(none)"}`);
    lines.push(`${s.id}: ${s.pick}${edits.length ? `, edited: ${edits.join("; ")}` : ""}`);
  });
  lines.push("Save these choices.");
  document.getElementById("out").value = lines.join("\n");
}

const addBtn = document.getElementById("add");
if (DATA.allowAdd === false) addBtn.style.display = "none";
addBtn.textContent = `Add a ${DATA.item}`;
addBtn.onclick = () => {
  newCount += 1;
  state.push({ id: `new-${newCount}`, orig: {}, vals: {}, pick: choices[0], isNew: true });
  render(); update();
};

document.getElementById("copy").onclick = async () => {
  const out = document.getElementById("out");
  const status = document.getElementById("status");
  try {
    await navigator.clipboard.writeText(out.value);
    status.textContent = "Copied. Paste it into the chat.";
  } catch (e) {
    out.focus(); out.select();
    try { document.execCommand("copy"); status.textContent = "Copied. Paste it into the chat."; }
    catch (e2) { status.textContent = "Select the text below and copy it."; }
  }
};

const stageEl = document.getElementById("stage");
if (DATA.stage) stageEl.textContent = DATA.stage; else stageEl.style.display = "none";
document.getElementById("title").textContent = DATA.title;
document.title = `Review: ${DATA.title}`;
render(); update();
</script>
</body>
</html>
